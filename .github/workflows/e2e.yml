name: E2E Tests

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature_added_socket_conn ]

jobs:
  mocked-e2e:
    name: Mocked automated flow (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run mocked automated flow (uses LocalS3Adapter)
        run: TEST_DISABLE_AUTH=1 npx babel-node scripts/automated_flow_test.js
      - name: Upload transcript & highlights artifacts (mocked)
        uses: actions/upload-artifact@v4
        with:
          name: mocked-transcripts
          path: |
            utils/uploads/artifacts/**/transcript.json
            utils/uploads/artifacts/**/highlights.json

  live-e2e:
    name: Live E2E (AssemblyAI + S3) - runs only when secrets are present
    runs-on: ubuntu-latest
    needs: mocked-e2e
    if: ${{ secrets.ASSEMBLYAI_API_KEY && secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run live end-to-end flow
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx babel-node scripts/run_live_e2e.js
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download transcript/highlights from S3 (best-effort)
        shell: bash
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -e
          mkdir -p utils/uploads/artifacts
          # list candidate objects under 'artifacts/' prefix and download JSON files
          if aws s3 ls "s3://${S3_BUCKET}/artifacts/" --recursive >/dev/null 2>&1; then
            echo 'Found artifacts in S3, attempting to download JSON files...'
            aws s3 cp "s3://${S3_BUCKET}/artifacts/" utils/uploads/artifacts/ --recursive --exclude "*" --include "*.json" || true
          else
            echo 'No artifacts prefix found in S3 (skipping)'
          fi
      - name: Upload transcript & highlights artifacts (live)
        uses: actions/upload-artifact@v4
        with:
          name: live-transcripts
          path: |
            utils/uploads/artifacts/**/transcript.json
            utils/uploads/artifacts/**/highlights.json
